org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# rive_common builds librive_text.so with a default NDK 25 that does not
# align for 16 KB pages. Use the NDK that Flutter already uses (r28).
rive.ndk.version=28.2.13676358
# rive_common declares minSdk 19; the app itself is minSdk 24, so no device can run it below 24.
android.ndk.suppressMinSdkVersionError=21
